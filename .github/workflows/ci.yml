name: CI

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read
  contents: read

env:
  # Lambda の runtime（infra/lambda.tf）と backend の esbuild target に合わせる。
  # ここがずれると、テストした環境と本番で実行する環境が違うことになる。
  NODE_VERSION: "24"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # ルートの package.json / package-lock.json と .github/workflows/** は
          # 全系統に影響しうる。これらを各フィルタに含めておかないと、
          # 依存更新やワークフロー変更だけの PR でテストジョブが 1 つも走らない。
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            infra:
              - 'infra/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # build:lambda は esbuild なので型を一切見ない。
      # このステップが無いと backend の型エラーは CI をすり抜ける。
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Lambda
        run: npm run build:lambda

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

  # CI の結果を 1 本に集約するジョブ。
  #
  # frontend / backend / infra は変更検出で skip されることがあり、skipped は
  # success ではない。全ジョブが skip された PR（docs だけの変更など）では
  # ワークフロー全体の conclusion も success にならず、ci-gate.yml の
  # workflow_run 判定にも必須ステータスチェックにも引っかからなくなる。
  # ここで always() で必ず 1 ジョブ結果を出し、
  # 「失敗・キャンセルが 1 つもないこと」を CI の成功条件として確定させる。
  ci:
    needs: [changes, frontend, backend, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::CI failed (job result: $r)"; exit 1 ;;
            esac
          done
          echo "all jobs passed or were skipped"
